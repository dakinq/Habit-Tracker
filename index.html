<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf6ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habit Tracker">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Habit Tracker</title>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flower" viewBox="0 0 40 40">
      <g fill="#ecc3bd" stroke="#c98f88" stroke-width="1">
        <ellipse cx="20" cy="9" rx="5.5" ry="8"/><ellipse cx="20" cy="9" rx="5.5" ry="8" transform="rotate(72 20 20)"/>
        <ellipse cx="20" cy="9" rx="5.5" ry="8" transform="rotate(144 20 20)"/><ellipse cx="20" cy="9" rx="5.5" ry="8" transform="rotate(216 20 20)"/>
        <ellipse cx="20" cy="9" rx="5.5" ry="8" transform="rotate(288 20 20)"/>
      </g>
      <circle cx="20" cy="20" r="4.5" fill="#d8ab78" stroke="#b98957" stroke-width="1"/>
    </symbol>
    <symbol id="leaf" viewBox="0 0 20 10"><path d="M1 5C6 -1 14 0 19 5 14 10 6 10 1 5z" fill="#c3d2b4" stroke="#8fa87d" stroke-width=".8"/></symbol>
    <symbol id="sprig" viewBox="0 0 80 60">
      <path d="M4 56C24 50 40 38 52 16" fill="none" stroke="#8fa87d" stroke-width="1.5" stroke-linecap="round"/>
      <use href="#leaf" x="14" y="38" width="20" height="10" transform="rotate(-20 24 43)"/>
      <use href="#leaf" x="28" y="40" width="18" height="9" transform="rotate(30 37 44)"/>
      <use href="#leaf" x="34" y="22" width="18" height="9" transform="rotate(-50 43 26)"/>
      <use href="#flower" x="44" y="0" width="30" height="30"/>
      <use href="#flower" x="22" y="22" width="14" height="14"/>
      <path d="M62 38c0-4 5-4 5 0 0 3-5 6-5 8 0-2-5-5-5-8 0-4 5-4 5 0z" fill="#ecc3bd" stroke="#c98f88" stroke-width=".8" transform="translate(4 4) scale(.9)"/>
    </symbol>
  </defs>
</svg>
<main id="view"></main>
<nav id="nav">
  <button data-view="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/></svg><span>Home</span></button>
  <button data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Einstellungen</span></button>
</nav>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
